  <rect x="48" y="46" width="6" height="168" rx="3" fill="url(#accent)"/>

  <text x="92" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="42" font-weight="600" letter-spacing="-0.5" fill="#f5f7fa">
    Bruno Villarreal
  </text>
  <text x="92" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
